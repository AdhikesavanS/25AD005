<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LibroTrack - Students</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef5fb, #dceaf7);
      color: #243b53;
    }

    header {
      background: #243b53;
      color: white;
      padding: 25px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
    }

    header a {
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 7px;
    }

    header a:hover {
      background: #3498db;
    }

    .container {
      width: 92%;
      max-width: 1050px;
      margin: 35px auto;
    }

    .box {
      background: white;
      padding: 28px;
      margin-bottom: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .box h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d9e0;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52,152,219,0.12);
    }

    button {
      padding: 12px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: #3498db;
      color: white;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }

    .secondary {
      background: #7f8c8d;
    }

    .delete-btn {
      background: #e74c3c;
      margin: 0;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      background: #34495e;
      color: white;
      padding: 14px;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e1e6ea;
      text-align: center;
    }

    tr:hover {
      background: #f5f9fc;
    }

    .empty {
      text-align: center;
      color: #7b8a97;
      padding: 25px;
    }

    @media(max-width: 750px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 20px;
      }

    }

  </style>

</head>

<body>

<header>

  <h1>LibroTrack - Students</h1>

  <a href="dashboard.html">
    Dashboard
  </a>

</header>


<div class="container">


  <div class="box">

    <h2>Add New Student</h2>

    <div class="form-grid">

      <input
              type="text"
              id="name"
              placeholder="Student Name">

      <input
              type="text"
              id="registerNumber"
              placeholder="Register Number">

      <input
              type="email"
              id="email"
              placeholder="Email Address">

    </div>

    <button onclick="addStudent()">
      Add Student
    </button>

    <button
            class="secondary"
            onclick="clearForm()">

      Clear

    </button>

  </div>


  <div class="box">

    <h2>Student List</h2>

    <div class="table-container">

      <table>

        <thead>

        <tr>

          <th>ID</th>
          <th>Name</th>
          <th>Register Number</th>
          <th>Email</th>
          <th>Action</th>

        </tr>

        </thead>

        <tbody id="studentTableBody">
        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

  const API_URL = "/api/students";


  function loadStudents() {

    fetch(API_URL)

            .then(response => response.json())

            .then(data => displayStudents(data))

            .catch(error => {

              alert("Unable to load students.");

              console.error(error);

            });

  }


  function displayStudents(students) {

    const tableBody =
            document.getElementById("studentTableBody");

    tableBody.innerHTML = "";


    if (students.length === 0) {

      tableBody.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No students found
                </td>
            </tr>
        `;

      return;

    }


    students.forEach(student => {

      const row =
              document.createElement("tr");


      row.innerHTML = `

            <td>${student.id}</td>

            <td>${student.name}</td>

            <td>${student.registerNumber}</td>

            <td>${student.email}</td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteStudent(${student.id})">

                    Delete

                </button>

            </td>

        `;


      tableBody.appendChild(row);

    });

  }


  function addStudent() {

    const name =
            document.getElementById("name").value.trim();

    const registerNumber =
            document.getElementById("registerNumber").value.trim();

    const email =
            document.getElementById("email").value.trim();


    if (!name || !registerNumber || !email) {

      alert("Please fill all student details.");

      return;

    }


    const student = {

      name: name,

      registerNumber: registerNumber,

      email: email

    };


    fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(student)

    })

            .then(response => {

              if (!response.ok) {
                throw new Error("Unable to add student.");
              }

              return response.json();

            })

            .then(() => {

              alert("Student added successfully.");

              clearForm();

              loadStudents();

            })

            .catch(error => {

              alert(error.message);

            });

  }


  function clearForm() {

    document.getElementById("name").value = "";
    document.getElementById("registerNumber").value = "";
    document.getElementById("email").value = "";

  }


  function deleteStudent(id) {

    if (!confirm("Do you want to delete this student?")) {
      return;
    }


    fetch(`${API_URL}/${id}`, {

      method: "DELETE"

    })

            .then(response => {

              if (!response.ok) {
                throw new Error("Unable to delete student.");
              }

              return response.text();

            })

            .then(message => {

              alert(message);

              loadStudents();

            })

            .catch(error => {

              alert(error.message);

            });

  }


  loadStudents();

</script>

</body>
</html>
