<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibroTrack Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef5fb, #dceaf7);
            color: #243b53;
        }

        header {
            background: #243b53;
            color: white;
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .home-btn {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 7px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #3498db;
        }

        .welcome {
            text-align: center;
            padding: 55px 20px 20px;
        }

        .welcome h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #687b8c;
        }

        .dashboard {
            max-width: 1050px;
            margin: 30px auto 70px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: auto;
            background: #e8f4fc;
            color: #3498db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: bold;
        }

        .card h2 {
            margin: 20px 0 10px;
        }

        .card p {
            color: #687b8c;
            min-height: 45px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #687b8c;
        }

        @media(max-width: 750px) {
            .dashboard {
                grid-template-columns: 1fr;
                margin: 20px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>LibroTrack Dashboard</h1>

    <a href="index.html" class="home-btn">
        Home
    </a>

</header>

<section class="welcome">

    <h2>Library Management Dashboard</h2>

    <p>
        Select a module to manage your library.
    </p>

</section>

<section class="dashboard">

    <div class="card">

        <div class="icon">B</div>

        <h2>Books</h2>

        <p>
            Add, search and manage library books.
        </p>

        <button onclick="location.href='books.html'">
            Open Books
        </button>

    </div>


    <div class="card">

        <div class="icon">S</div>

        <h2>Students</h2>

        <p>
            Add and manage student information.
        </p>

        <button onclick="location.href='students.html'">
            Open Students
        </button>

    </div>


    <div class="card">

        <div class="icon">I</div>

        <h2>Issue & Return</h2>

        <p>
            Issue books, return books and
            check fines.
        </p>

        <button onclick="location.href='issue-return.html'">
            Open Transactions
        </button>

    </div>

</section>

<footer>
    LibroTrack Library Management System
</footer>

</body>
</html>
