<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibroTrack - Books</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef5fb, #dceaf7);
            color: #243b53;
        }

        header {
            background: #243b53;
            color: white;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 7px;
        }

        header a:hover {
            background: #3498db;
        }

        .container {
            width: 92%;
            max-width: 1150px;
            margin: 35px auto;
        }

        .box {
            background: white;
            padding: 28px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .box h2 {
            margin-top: 0;
            color: #243b53;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d9e0;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.12);
        }

        button {
            padding: 12px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .secondary {
            background: #7f8c8d;
        }

        .secondary:hover {
            background: #687778;
        }

        .delete-btn {
            background: #e74c3c;
            margin: 0;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-row input {
            flex: 1;
        }

        .search-row button {
            margin-top: 0;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #34495e;
            color: white;
            padding: 14px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e1e6ea;
            text-align: center;
        }

        tr:hover {
            background: #f5f9fc;
        }

        .empty {
            text-align: center;
            color: #7b8a97;
            padding: 25px;
        }

        @media(max-width: 750px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-row {
                flex-direction: column;
            }

            header {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>LibroTrack - Books</h1>

    <a href="dashboard.html">
        Dashboard
    </a>

</header>


<div class="container">


    <!-- Add Book -->

    <div class="box">

        <h2>Add New Book</h2>

        <div class="form-grid">

            <input
                    type="text"
                    id="title"
                    placeholder="Book Title">

            <input
                    type="text"
                    id="author"
                    placeholder="Author">

            <input
                    type="text"
                    id="isbn"
                    placeholder="ISBN">

            <input
                    type="text"
                    id="category"
                    placeholder="Category">

            <input
                    type="number"
                    id="totalCopies"
                    placeholder="Total Copies"
                    min="1">

        </div>

        <button onclick="addBook()">
            Add Book
        </button>

        <button
                class="secondary"
                onclick="clearForm()">

            Clear

        </button>

    </div>


    <!-- Search -->

    <div class="box">

        <h2>Search Books</h2>

        <div class="search-row">

            <input
                    type="text"
                    id="keyword"
                    placeholder="Search by title, author or category">

            <button onclick="searchBooks()">
                Search
            </button>

            <button
                    class="secondary"
                    onclick="loadBooks()">

                Show All

            </button>

        </div>

    </div>


    <!-- Book List -->

    <div class="box">

        <h2>Book Collection</h2>

        <div class="table-container">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Category</th>
                    <th>Total</th>
                    <th>Available</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody id="bookTableBody">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    const API_URL = "/api/books";


    function loadBooks() {

        fetch(API_URL)

            .then(response => response.json())

            .then(data => displayBooks(data))

            .catch(error => {

                alert("Unable to load books.");

                console.error(error);

            });

    }


    function displayBooks(books) {

        const tableBody =
            document.getElementById("bookTableBody");

        tableBody.innerHTML = "";

        if (books.length === 0) {

            tableBody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No books found
                </td>
            </tr>
        `;

            return;
        }


        books.forEach(book => {

            const row = document.createElement("tr");

            row.innerHTML = `

            <td>${book.id}</td>

            <td>${book.title}</td>

            <td>${book.author}</td>

            <td>${book.isbn}</td>

            <td>${book.category || "-"}</td>

            <td>${book.totalCopies}</td>

            <td>${book.availableCopies}</td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteBook(${book.id})">

                    Delete

                </button>

            </td>

        `;

            tableBody.appendChild(row);

        });

    }


    function addBook() {

        const title =
            document.getElementById("title").value.trim();

        const author =
            document.getElementById("author").value.trim();

        const isbn =
            document.getElementById("isbn").value.trim();

        const category =
            document.getElementById("category").value.trim();

        const totalCopies =
            parseInt(
                document.getElementById("totalCopies").value
            );


        if (!title || !author || !isbn || !totalCopies || totalCopies < 1) {

            alert("Please enter all required book details.");

            return;

        }


        const book = {

            title: title,
            author: author,
            isbn: isbn,
            category: category,
            totalCopies: totalCopies

        };


        fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(book)

        })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Unable to add book.");
                }

                return response.json();

            })

            .then(() => {

                alert("Book added successfully.");

                clearForm();

                loadBooks();

            })

            .catch(error => {

                alert(error.message);

            });

    }


    function clearForm() {

        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("isbn").value = "";
        document.getElementById("category").value = "";
        document.getElementById("totalCopies").value = "";

    }


    function searchBooks() {

        const keyword =
            document.getElementById("keyword").value.trim();


        if (!keyword) {

            loadBooks();

            return;

        }


        fetch(
            `${API_URL}/search?keyword=${encodeURIComponent(keyword)}`
        )

            .then(response => response.json())

            .then(data => displayBooks(data))

            .catch(error => {

                alert("Search failed.");

                console.error(error);

            });

    }


    function deleteBook(id) {

        const confirmDelete =
            confirm("Do you want to delete this book?");


        if (!confirmDelete) {
            return;
        }


        fetch(`${API_URL}/${id}`, {

            method: "DELETE"

        })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Unable to delete book.");
                }

                return response.text();

            })

            .then(message => {

                alert(message);

                loadBooks();

            })

            .catch(error => {

                alert(error.message);

            });

    }


    loadBooks();

</script>

</body>
</html>
